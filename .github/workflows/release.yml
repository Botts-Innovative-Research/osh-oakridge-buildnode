name: Release

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  OSCAR_DIR: 'web/oscar-viewer'
  DIST_DIR: 'build/distributions'
  DOCS_DIR: 'build/documentation'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Tags must be created on main."
            exit 1
          fi

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check build.gradle version matches tag
        run: |
          gradle_version=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle)
          tag_version="${{ steps.tag.outputs.version }}"
          if [ "$gradle_version" != "$tag_version" ]; then
            echo "::error::build.gradle version ($gradle_version) does not match tag version ($tag_version)"
            exit 1
          fi
          echo "Version check passed: $gradle_version"

      - name: Check config.json deploymentName matches tag
        run: |
          tag_version="${{ steps.tag.outputs.version }}"
          expected="OSCAR $tag_version"
          actual=$(grep -oP '"deploymentName"\s*:\s*"\K[^"]+' dist/config/standard/config.json)
          if [ "$actual" != "$expected" ]; then
            echo "::error::config.json deploymentName ($actual) does not match expected ($expected)"
            exit 1
          fi
          echo "deploymentName check passed: $actual"

      - name: Check release environment version matches tag
        run: |
          tag_version="${{ steps.tag.outputs.version }}"
          env_version=$(grep -oP '^OSCAR_VERSION=\K.*' dist/release/.env.example)
          if [ "$env_version" != "$tag_version" ]; then
            echo "::error::.env.example OSCAR_VERSION ($env_version) does not match tag version ($tag_version)"
            exit 1
          fi
          echo "Release environment version check passed: $env_version"

      - name: Check changelog and documentation versions match tag
        run: node tools/validate-release-metadata.js "${{ steps.tag.outputs.version }}"

      - name: Check no pgdata in dist/release/postgis
        run: |
          if [ -d "dist/release/postgis/pgdata" ]; then
            echo "::error::pgdata directory exists in dist/release/postgis — remove it before releasing"
            exit 1
          fi
          echo "No pgdata directory found — check passed"

  build:
    name: Build Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            $1 == "##" && $2 == version { found = 1; next }
            found && $1 == "##" && $2 ~ /^[0-9]/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' changelog.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "::error::No release notes found for version $version in changelog.md"
            exit 1
          fi

          echo "Release notes for $version:"
          cat "$notes_file"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.OSCAR_DIR }}/package-lock.json

      - name: Install PDF documentation tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            fonts-noto-mono \
            lmodern \
            pandoc \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-french \
            texlive-lang-greek \
            texlive-lang-spanish \
            texlive-latex-extra \
            texlive-xetex

      - name: Build and validate localized operator manuals
        run: tools/documentation/build-operator-manual-pdfs.sh "${GITHUB_REF_NAME#v}" "${DOCS_DIR}"

      - name: Package source with submodules
        id: source
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          TAG="${GITHUB_REF_NAME}"
          SOURCE_DIR="${REPO_NAME}-${TAG}"
          SOURCE_ROOT="/tmp/source-archive/${SOURCE_DIR}"
          SOURCE_ZIP="/tmp/${SOURCE_DIR}-source.zip"
          TRACKED_FILES="$(mktemp)"
          mkdir -p /tmp/source-archive

          # Package only content tracked by the tagged repository and its
          # checked-out submodules. The build mutates the runner workspace, so
          # copying the whole directory would include node_modules and other
          # generated or ignored files.
          git ls-files --recurse-submodules > "$TRACKED_FILES"
          rsync -a --files-from="$TRACKED_FILES" ./ "$SOURCE_ROOT/"

          cd /tmp/source-archive
          zip -q -r "$SOURCE_ZIP" "$SOURCE_DIR"

          if unzip -Z1 "$SOURCE_ZIP" | grep -q '/node_modules/'; then
            echo "::error::Source archive unexpectedly contains node_modules"
            exit 1
          fi

          echo "Source archive contains only tracked repository and submodule files:"
          du -h "$SOURCE_ZIP"
          echo "archive=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"

      - name: Build connected release
        run: ./build-all.sh

      - name: Validate packaged release documentation
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="${DIST_DIR}/oscar-${version}.zip"
          listing="$RUNNER_TEMP/connected-release-files.txt"
          unzip -Z1 "$archive" > "$listing"

          for expected in \
            documentation/QUICKSTART.md \
            documentation/DEPLOYMENT.md \
            documentation/OPERATIONAL_VIEWS.md \
            documentation/STATUS_OF_HEALTH.md \
            documentation/operator-manual/README.md \
            documentation/operator-manual/README_es.md \
            documentation/operator-manual/README_fr.md \
            documentation/operator-manual/README_el.md \
            "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-en.pdf" \
            "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-es.pdf" \
            "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-fr.pdf" \
            "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-el.pdf"
          do
            grep -Fq "/$expected" "$listing" || {
              echo "::error::Connected release is missing $expected"
              exit 1
            }
          done

          if grep -Eq 'OSCAR_System_Documentation_Manual_3\.5\.md|Node Administration\.pdf' "$listing"; then
            echo "::error::Connected release contains legacy pre-4.0 documentation"
            exit 1
          fi

      - name: Build Windows offline release artifacts
        shell: pwsh
        run: |
          ./tools/offline/build-offline-bundle.ps1 `
            -BundleProfile Both `
            -SkipConnectedBuild `
            -CreateArchive

      - name: Validate offline release artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for profile in full images; do
            archive="build/offline/oscar-${version}-windows-x86_64-offline-${profile}.zip"
            checksum="${archive}.sha256"
            listing="$RUNNER_TEMP/offline-${profile}-release-files.txt"
            test -s "$archive"
            test -s "$checksum"
            if [ "$(stat -c '%s' "$archive")" -ge 2147483648 ]; then
              echo "::error::Release asset exceeds GitHub's 2 GiB per-file limit: $archive"
              exit 1
            fi
            (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$checksum")")
            unzip -Z1 "$archive" > "$listing"

            for expected in \
              documentation/QUICKSTART.md \
              documentation/DEPLOYMENT.md \
              documentation/OPERATIONAL_VIEWS.md \
              documentation/STATUS_OF_HEALTH.md \
              documentation/operator-manual/README.md \
              documentation/operator-manual/README_es.md \
              documentation/operator-manual/README_fr.md \
              documentation/operator-manual/README_el.md \
              "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-en.pdf" \
              "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-es.pdf" \
              "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-fr.pdf" \
              "documentation/operator-manual/OSCAR-${version}-Administrator-Operator-Manual-el.pdf"
            do
              grep -Fq "/$expected" "$listing" || {
                echo "::error::Offline $profile bundle is missing $expected"
                exit 1
              }
            done

            if grep -Eq 'OSCAR_System_Documentation_Manual_3\.5\.md|Node Administration\.pdf' "$listing"; then
              echo "::error::Offline $profile bundle contains legacy pre-4.0 documentation"
              exit 1
            fi
          done

      - name: Stage source archive
        run: cp "${{ steps.source.outputs.archive }}" "${DIST_DIR}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            ${{ env.DIST_DIR }}/oscar-*.zip
            ${{ env.DIST_DIR }}/*-source.zip
            ${{ env.DOCS_DIR }}/OSCAR-*-Administrator-Operator-Manual-*.pdf
            build/offline/oscar-*-windows-x86_64-offline-*.zip
            build/offline/oscar-*-windows-x86_64-offline-*.zip.sha256
