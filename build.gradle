apply from: gradle.oshCoreDir + '/common.gradle'
description = ''

allprojects {
    version = "3.11.0"
}

subprojects {
    repositories.addAll(rootProject.repositories)
}

dependencies {
    // FROM OSH-CORE
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation 'org.sensorhub:sensorhub-core-osgi:' + oshCoreVersion
    implementation 'org.sensorhub:sensorhub-datastore-h2:' + oshCoreVersion
    implementation 'org.sensorhub:sensorhub-service-swe:' + oshCoreVersion
    implementation 'org.sensorhub:sensorhub-webui-core:' + oshCoreVersion
    // Connected Systems
    implementation 'org.sensorhub:sensorhub-service-consys'

    // FROM OSH-ADDONS
    implementation project(':sensorhub-driver-videocam')
    implementation project(':sensorhub-driver-rtpcam')
    implementation project(':sensorhub-driver-ffmpeg')
    implementation project(':sensorhub-process-ffmpeg')
    implementation project(':sensorhub-service-video')
    implementation project(':sensorhub-datastore-postgis')
    implementation project(':sensorhub-service-fileserver')
//  implementation project(':sensorhub-driver-dahua')
// !!WARNING!! If you need to use the Axis driver, you must ensure the driver has a non-vulnerable version of log4j
//  implementation project(':sensorhub-driver-axis')
//    implementation project(':sensorhub-driver-sony-vb600')

    // FROM OSH-OAKRIDGE-MODULES
    // Drivers
    implementation project(':sensorhub-driver-kromek-d3s')
    implementation project(':sensorhub-driver-rs350')
    implementation project(':sensorhub-driver-rapiscan')
    implementation project(':sensorhub-driver-aspect')
    implementation project(':sensorhub-driver-kromek-d5')

    // Processes

    // Additional Modules
    implementation project(':sensorhub-system-lane')
    implementation project(':sensorhub-webui-oscar')
    implementation project(':sensorhub-service-oscar')
    implementation project(':sensorhub-service-bucket')
    implementation project(':sensorhub-service-dailyfile-journal')
    implementation project(':sensorhub-security-basic-session')

    implementation project(':security-utils')

    // For MQTT
    implementation project(':sensorhub-service-consys-mqtt')
    implementation project(':sensorhub-service-mqtt-hivemq')
}

configurations {
    rel
    dev
    stable
}

distributions{
    rel {
        distributionBaseName = 'oscar'
        contents {
            // OSH NODE
            into("osh-node-oscar/") {
                from 'dist/scripts/standard'
                from 'dist/config/standard'
                exclude 'osh-keystore.p12'
            }
            into ("osh-node-oscar/config") {
                from 'dist/config/eml'
            }
            into("osh-node-oscar/trusted_certificates") {
                from 'scripts/trusted_certificates'
            }
            into("osh-node-oscar/rules") {
                from 'dist/rules'
            }
            into("osh-node-oscar/documentation") {
                // The files formerly copied from dist/documentation describe a
                // legacy Admin UI and launch workflow. Package the maintained
                // release and feature guides instead of relabeling legacy docs.
                from('dist/release') {
                    include 'QUICKSTART.md'
                    include 'DEPLOYMENT.md'
                }
                from('docs') {
                    include 'LIVE_VIDEO.md'
                    include 'OPERATIONAL_VIEWS.md'
                    include 'STATUS_OF_HEALTH.md'
                    include 'TRANSLATION_SYSTEM.md'
                    include 'STORAGE_ARCHITECTURE.md'
                    include 'DATA_LIFECYCLE.md'
                    include 'ARCHIVE_FORMAT.md'
                    include 'BACKUP_RESTORE.md'
                    include 'STORAGE_OPERATIONS.md'
                    filesMatching('STORAGE_ARCHITECTURE.md') {
                        filter { line -> line.replace('../include/osh-oakridge-modules/docs/', '') }
                    }
                }
                from('include/osh-oakridge-modules/docs') {
                    include 'daily-file-journal-v1.md'
                    include 'retained-media-v1.md'
                }
                filesMatching('DEPLOYMENT.md') {
                    filter { line -> line.replace('../../docs/', '') }
                }
            }
            into("osh-node-oscar/documentation/operator-manual") {
                from('include/osh-oakridge-modules/services/sensorhub-service-oscar/src/main/resources/com/botts/impl/service/oscar/i18n') {
                    include 'README.md'
                    include 'README_es.md'
                    include 'README_fr.md'
                    include 'README_el.md'
                }
            }
            // Keep operator documentation outside the application build
            // context as well, so it remains available in offline bundles
            // that intentionally remove osh-node-oscar after exporting images.
            into("documentation") {
                from('dist/release') {
                    include 'QUICKSTART.md'
                    include 'DEPLOYMENT.md'
                }
                from('docs') {
                    include 'LIVE_VIDEO.md'
                    include 'OPERATIONAL_VIEWS.md'
                    include 'STATUS_OF_HEALTH.md'
                    include 'TRANSLATION_SYSTEM.md'
                    include 'STORAGE_ARCHITECTURE.md'
                    include 'DATA_LIFECYCLE.md'
                    include 'ARCHIVE_FORMAT.md'
                    include 'BACKUP_RESTORE.md'
                    include 'STORAGE_OPERATIONS.md'
                    filesMatching('STORAGE_ARCHITECTURE.md') {
                        filter { line -> line.replace('../include/osh-oakridge-modules/docs/', '') }
                    }
                }
                from('include/osh-oakridge-modules/docs') {
                    include 'daily-file-journal-v1.md'
                    include 'retained-media-v1.md'
                }
                filesMatching('DEPLOYMENT.md') {
                    filter { line -> line.replace('../../docs/', '') }
                }
            }
            into("documentation/operator-manual") {
                from('include/osh-oakridge-modules/services/sensorhub-service-oscar/src/main/resources/com/botts/impl/service/oscar/i18n') {
                    include 'README.md'
                    include 'README_es.md'
                    include 'README_fr.md'
                    include 'README_el.md'
                }
                // The release workflow generates these before build-all.sh.
                // Local builds without PDF tooling still receive Markdown.
                from('build/documentation') {
                    include "OSCAR-${project.version}-Administrator-Operator-Manual-*.pdf"
                }
            }
            into("osh-node-oscar/web") {
                from 'web/oscar-viewer/web'
            }
            into("osh-node-oscar/") {
                from 'README.md'
                from 'changelog.md'
                filesMatching('README.md') {
                    filter { line -> line.replace('(dist/release/', '(documentation/').replace('(docs/', '(documentation/') }
                }
            }
            into("osh-node-oscar/lib") {
                from 'third-party-drivers'
                from project.configurations.runtimeClasspath
            }
            // POSTGIS / DOCKER / SCRIPTS
            into('.') {
                from('dist/release')
                // This is deliberately an allowlist. A release tree may have
                // been used for a local deployment, restore drill, or offline
                // staging; never package its data, backups, credentials,
                // receipts, locks, or generated image archives.
                include '.dockerignore'
                include '.env.example'
                include 'DEPLOYMENT.md'
                include 'QUICKSTART.md'
                include 'compose.yaml'
                include 'configure-windows-host.ps1'
                include 'docker/gateway/default.conf'
                include 'docker/oscar/archive-object-helper.sh'
                include 'docker/oscar/atomic-publish.c'
                include 'docker/oscar/Dockerfile'
                include 'docker/oscar/entrypoint.sh'
                include 'installers/README.md'
                include 'oscar-setup.ps1'
                include 'oscar-setup.sh'
                include 'oscar-storage.ps1'
                include 'oscar-storage.sh'
                include 'oscar.bat'
                include 'oscar.sh'
                include 'postgis/Dockerfile'
                include 'postgis/archive-wal.sh'
                include 'postgis/merge-wal-restore.sh'
                include 'postgis/prepare-restore.sh'
                include 'postgis/init-app-role.sh'
                include 'postgis/init-extensions.sql'
                include 'validate-storage-archive.sh'
                include 'verify-bundle.ps1'
                include 'verify-bundle.sh'
                filesMatching('.env.example') {
                    filter { line -> line.startsWith('OSCAR_VERSION=') ? "OSCAR_VERSION=${project.version}" : line }
                }
                filesMatching('DEPLOYMENT.md') {
                    filter { line -> line.replace('../../docs/', 'documentation/') }
                }
                filesMatching('**/*.sh') {
                    // Preserve desktop/terminal launchability in the release ZIP,
                    // even when the archive is assembled on Windows.
                    mode = 0755
                }
            }

        }
    }
}

apply from: gradle.oshCoreDir + '/release.gradle'
