name: oscar

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.28.1-alpine
    restart: unless-stopped
    depends_on:
      oscar:
        condition: service_healthy
    ports:
      - "${OSCAR_HTTPS_PORT:-443}:8443"
      - "80:8080"
    networks:
      - frontend
    secrets:
      - source: tls_certificate
        target: tls_certificate.pem
      - source: tls_private_key
        target: tls_private_key.pem
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  oscar:
    build:
      context: .
      dockerfile: docker/oscar/Dockerfile
      args:
        OSCAR_VERSION: "${OSCAR_VERSION:-local}"
    image: "oscar:${OSCAR_VERSION:-local}"
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - database
    secrets:
      - source: oscar_admin_password
        target: oscar_admin_password
      - source: oscar_db_password
        target: oscar_db_password
    environment:
      TZ: "${OSCAR_TIMEZONE:-UTC}"
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/oscar_admin_password
      OSCAR_DB_PASSWORD_FILE: /run/secrets/oscar_db_password
      JAVA_OPTS: "${OSCAR_JAVA_OPTS:--Xms1g -Xmx6g -Xss256k -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError}"
    volumes:
      - oscar_state:/var/lib/oscar
      - type: bind
        source: ${OSCAR_ARCHIVE_DIR:-../oscar-storage/archive}
        target: /var/lib/oscar/archive
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      # DuckDB JDBC and the other JVM JNI loaders must map their extracted
      # libraries. Keep that narrowly scoped exception private and bounded;
      # the general-purpose temporary directory remains non-executable.
      - /run/oscar-native:rw,exec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/oscar-ready && curl --silent --show-error --output /dev/null http://127.0.0.1:8282/"]
      start_period: 90s
      interval: 30s
      timeout: 5s
      retries: 5
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "8"

  postgres:
    platform: "${OSCAR_POSTGIS_PLATFORM:-linux/amd64}"
    build:
      context: ./postgis
      dockerfile: Dockerfile
      args:
        OSCAR_VERSION: "${OSCAR_VERSION:-local}"
    image: "oscar-postgis:${OSCAR_VERSION:-local}"
    restart: unless-stopped
    user: postgres
    networks:
      - database
    secrets:
      - source: postgres_bootstrap_password
        target: postgres_bootstrap_password
      - source: oscar_db_password
        target: oscar_db_password
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: oscar_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      OSCAR_DB_PASSWORD_FILE: /run/secrets/oscar_db_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=scram-sha-256 --auth-host=scram-sha-256 -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=on
      - -c
      - archive_mode=off
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=oscar_bootstrap --dbname=gis"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "8"

networks:
  frontend:
  database:
    internal: true

volumes:
  oscar_state:
    external: true
    name: oscar_oscar_state
  postgres_data:
    external: true
    name: oscar_postgres_data

secrets:
  oscar_admin_password:
    file: ${OSCAR_SECRETS_DIR:-./secrets}/oscar-admin-password.txt
  oscar_db_password:
    file: ${OSCAR_SECRETS_DIR:-./secrets}/oscar-db-password.txt
  postgres_bootstrap_password:
    file: ${OSCAR_SECRETS_DIR:-./secrets}/postgres-bootstrap-password.txt
  tls_certificate:
    file: ${OSCAR_TLS_DIR:-./tls}/server.crt
  tls_private_key:
    file: ${OSCAR_TLS_DIR:-./tls}/server.key
