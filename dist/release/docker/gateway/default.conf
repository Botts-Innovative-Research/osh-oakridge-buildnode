server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/tls_certificate.pem;
    ssl_certificate_key /run/secrets/tls_private_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 2g;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Human-friendly workstation URL; the query form is canonical so the
    # static viewer can preserve the scope across every exported route.
    location ~ "^/view/([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)/?$" {
        return 302 /?view=$1;
    }

    # Keep malformed view aliases from falling through to the unscoped app.
    location = /view {
        return 302 /?view=;
    }

    location /view/ {
        return 302 /?view=;
    }

    location / {
        proxy_pass http://oscar:8282;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
